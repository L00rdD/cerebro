[package]
name = "cerebro-app"
description = "Cerebro desktop shell: tray icon, panel window and dependency wiring."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cerebro_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
cerebro-domain.workspace = true
cerebro-data.workspace = true
cerebro-protocol.workspace = true
cerebro-web.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-positioner = { version = "2.4", features = ["tray-icon"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1"

[lints]
workspace = true
