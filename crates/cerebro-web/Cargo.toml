[package]
name = "cerebro-web"
description = "Serves the Cerebro UI and a live snapshot feed over HTTP, for phones on a private network."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cerebro-domain.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio"] }
futures-util = { version = "0.3", default-features = false }
getrandom = { version = "0.3", features = ["std"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt", "io-util"] }

[lints]
workspace = true
