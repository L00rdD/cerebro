[workspace]
resolver = "3"
members = [
    "crates/cerebro-protocol",
    "crates/cerebro-domain",
    "crates/cerebro-data",
    "crates/cerebro-hook",
    "crates/cerebro-cli",
    "src-tauri",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
cerebro-protocol = { path = "crates/cerebro-protocol" }
cerebro-domain = { path = "crates/cerebro-domain" }
cerebro-data = { path = "crates/cerebro-data" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
